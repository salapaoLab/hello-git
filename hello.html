<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="หน้า Hello World พร้อม Animation ด้วย Tailwind CSS"
  />

  <title>Hello World</title>

  <script src="[cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            float: {
              "0%, 100%": { transform: "translateY(0) rotate(0deg)" },
              "50%": { transform: "translateY(-24px) rotate(3deg)" },
            },
            fadeUp: {
              "0%": {
                opacity: "0",
                transform: "translateY(30px)",
              },
              "100%": {
                opacity: "1",
                transform: "translateY(0)",
              },
            },
            gradient: {
              "0%, 100%": { backgroundPosition: "0% 50%" },
              "50%": { backgroundPosition: "100% 50%" },
            },
            pulseSoft: {
              "0%, 100%": {
                opacity: "0.35",
                transform: "scale(1)",
              },
              "50%": {
                opacity: "0.65",
                transform: "scale(1.12)",
              },
            },
          },
          animation: {
            float: "float 6s ease-in-out infinite",
            fadeUp: "fadeUp 0.9s ease-out forwards",
            gradient: "gradient 8s ease infinite",
            pulseSoft: "pulseSoft 5s ease-in-out infinite",
          },
        },
      },
    };
  </script>

  <style>
    body {
      background-size: 300% 300%;
    }

    .animation-delay-200 {
      animation-delay: 200ms;
    }

    .animation-delay-400 {
      animation-delay: 400ms;
    }

    .animation-delay-700 {
      animation-delay: 700ms;
    }
  </style>
</head>

<body
  class="min-h-screen overflow-hidden bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950 font-sans text-white animate-gradient"
>
  <main class="relative flex min-h-screen items-center justify-center px-6">
    <!-- Background glow -->
    <div
      class="pointer-events-none absolute left-[8%] top-[12%] h-72 w-72 rounded-full bg-fuchsia-500/30 blur-3xl animate-pulseSoft"
    ></div>

    <div
      class="pointer-events-none absolute bottom-[8%] right-[7%] h-80 w-80 rounded-full bg-cyan-400/25 blur-3xl animate-pulseSoft animation-delay-700"
    ></div>

    <!-- Floating decorations -->
    <div
      class="absolute left-[12%] top-[20%] h-16 w-16 rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md animate-float"
    ></div>

    <div
      class="absolute bottom-[17%] right-[14%] h-24 w-24 rounded-full border border-cyan-300/20 bg-cyan-300/10 backdrop-blur-md animate-float animation-delay-700"
    ></div>

    <!-- Content card -->
    <section
      class="relative z-10 w-full max-w-4xl overflow-hidden rounded-[2rem] border border-white/15 bg-white/[0.08] p-8 text-center shadow-2xl shadow-purple-950/50 backdrop-blur-xl sm:p-14"
    >
      <div
        class="mx-auto mb-8 flex h-20 w-20 items-center justify-center rounded-3xl bg-gradient-to-br from-fuchsia-500 to-cyan-400 shadow-lg shadow-fuchsia-500/30 animate-float"
      >
        <span class="text-4xl" aria-hidden="true">👋</span>
      </div>

      <p
        class="mb-4 translate-y-8 text-sm font-semibold uppercase tracking-[0.35em] text-cyan-300 opacity-0 animate-fadeUp"
      >
        Welcome to my website
      </p>

      <h1
        class="translate-y-8 bg-gradient-to-r from-white via-fuchsia-200 to-cyan-200 bg-clip-text text-5xl font-black leading-tight text-transparent opacity-0 animate-fadeUp animation-delay-200 sm:text-7xl md:text-8xl"
      >
        Hello World
      </h1>

      <p
        class="mx-auto mt-6 max-w-2xl translate-y-8 text-base leading-8 text-slate-300 opacity-0 animate-fadeUp animation-delay-400 sm:text-lg"
      >
        หน้าเว็บเรียบง่ายแต่โดดเด่น สร้างด้วย
        <span class="font-semibold text-cyan-300">HTML</span>
        และ
        <span class="font-semibold text-fuchsia-300">Tailwind CSS</span>
        พร้อม Animation ที่ลื่นไหล
      </p>

      <div
        class="mt-10 translate-y-8 opacity-0 animate-fadeUp animation-delay-700"
      >
        <button
          id="helloButton"
          type="button"
          class="group relative inline-flex items-center gap-3 overflow-hidden rounded-full bg-white px-7 py-3.5 font-bold text-slate-950 shadow-xl shadow-cyan-500/20 transition duration-300 hover:-translate-y-1 hover:shadow-cyan-400/40 focus:outline-none focus:ring-4 focus:ring-cyan-300/40"
        >
          <span
            class="absolute inset-0 -translate-x-full bg-gradient-to-r from-cyan-300 to-fuchsia-300 transition-transform duration-500 group-hover:translate-x-0"
          ></span>

          <span class="relative">Say Hello</span>

          <svg
            class="relative h-5 w-5 transition-transform duration-300 group-hover:translate-x-1"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 12h14m-6-6 6 6-6 6"
            />
          </svg>
        </button>

        <p
          id="message"
          class="mt-5 min-h-7 text-sm font-medium text-cyan-200 transition duration-300"
          aria-live="polite"
        ></p>
      </div>
    </section>

    <footer
      class="absolute bottom-5 left-0 right-0 text-center text-xs text-slate-400"
    >
      Made with HTML + Tailwind CSS
    </footer>
  </main>

  <script>
    const button = document.getElementById("helloButton");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      message.textContent = "Hello! ยินดีต้อนรับสู่เว็บไซต์ของเรา ✨";
      message.classList.add("scale-110");

      setTimeout(() => {
        message.classList.remove("scale-110");
      }, 250);
    });
  </script>
</body>
</html>
